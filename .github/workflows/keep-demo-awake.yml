name: Keep the demo's server awake (judging week)

# The live demo's agent and the app talk to a server on Render's free tier,
# which sleeps after 15 minutes without a request and then takes 30 to 50 s to
# wake. During judging (until 8 November 2026) a request every few minutes
# keeps it awake, so a judge never waits. After that date the job does nothing.
# The free tier has 750 hours a month for the whole workspace; one awake week
# is about 170 of them.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health until 8 November
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261108 ]; then
            echo "Judging is over: nothing to do."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://remote-control-skyworth.onrender.com/health || echo 000)
          echo "HTTP $code"
