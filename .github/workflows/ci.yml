name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tests
        run: python -m unittest -v
      # The numbers in the README come from this command and nothing else.
      - name: Evaluation
        run: python -m dna.evaluate
      - name: Simulation
        run: python -m dna.simulate
      - name: Deep search sweep
        run: python -m dna.sweep
